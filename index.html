<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Content Writer</title>
  <style>
    :root {
      --ink: #1c1a17;
      --paper: #f6f2e9;
      --card: #fffdf8;
      --muted: #6b655c;
      --line: #ddd5c7;
      --accent: #2f6b52;
      --accent-soft: #e7efe9;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 28px; }
    h1 {
      font-size: 34px;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    .sub { color: var(--muted); font-size: 16px; margin: 0; }

    .tabs { display: flex; gap: 8px; margin: 24px 0 20px; flex-wrap: wrap; }
    .tab {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink);
      transition: all 0.15s;
    }
    .tab:hover { border-color: var(--accent); }
    .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    label {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      font-family: Georgia, serif;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      resize: vertical;
      color: var(--ink);
    }
    textarea:focus { outline: none; border-color: var(--accent); }

    .controls {
      display: flex;
      gap: 16px;
      margin: 16px 0;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .control { flex: 1; min-width: 130px; }
    select {
      width: 100%;
      padding: 10px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
    }
    select:focus { outline: none; border-color: var(--accent); }

    .go {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 13px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .go:hover { opacity: 0.9; }
    .go:disabled { opacity: 0.5; cursor: default; }

    .error {
      font-family: -apple-system, system-ui, sans-serif;
      color: #a3341f;
      font-size: 14px;
      margin-top: 12px;
    }

    .results { margin-top: 32px; }
    .result {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 16px;
      position: relative;
      white-space: pre-wrap;
      font-size: 16px;
    }
    .result .num {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 8px;
    }
    .copy {
      font-family: -apple-system, system-ui, sans-serif;
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
    }
    .copy:hover { border-color: var(--accent); color: var(--accent); }

    .hint { font-family: -apple-system, system-ui, sans-serif; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AI Content Writer</h1>
      <p class="sub">Pick a mode, set the tone, and generate copy in one click.</p>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="linkedin">LinkedIn post</button>
      <button class="tab" data-mode="email">Rewrite email</button>
      <button class="tab" data-mode="blog">Blog to social</button>
    </div>

    <label id="inputLabel">Your topic</label>
    <textarea id="topic" placeholder="e.g. why small businesses should use AI"></textarea>

    <div class="controls">
      <div class="control">
        <label>Tone</label>
        <select id="tone">
          <option value="default">Default</option>
          <option value="formal">Formal</option>
          <option value="casual">Casual</option>
          <option value="punchy">Punchy</option>
          <option value="friendly">Friendly</option>
        </select>
      </div>
      <div class="control">
        <label>Variations</label>
        <select id="count">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="control" style="flex: 0;">
        <button class="go" id="go" onclick="generate()">Write it</button>
      </div>
    </div>

    <div class="error" id="error"></div>
    <div class="results" id="results">
      <p class="hint">Your results will appear here.</p>
    </div>
  </div>

  <script>
    let mode = "linkedin";
    const labels = {
      linkedin: { label: "Your topic", ph: "e.g. why small businesses should use AI" },
      email: { label: "Paste the email to rewrite", ph: "e.g. Hey, you still haven't sent the file. I need it now." },
      blog: { label: "Paste your blog content or idea", ph: "e.g. a blog post about the benefits of remote work..." }
    };

    document.getElementById("tabs").addEventListener("click", (e) => {
      if (!e.target.classList.contains("tab")) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      e.target.classList.add("active");
      mode = e.target.dataset.mode;
      document.getElementById("inputLabel").textContent = labels[mode].label;
      document.getElementById("topic").placeholder = labels[mode].ph;
    });

    async function generate() {
      const topic = document.getElementById("topic").value.trim();
      const tone = document.getElementById("tone").value;
      const count = document.getElementById("count").value;
      const errorEl = document.getElementById("error");
      const resultsEl = document.getElementById("results");
      const btn = document.getElementById("go");

      errorEl.textContent = "";

      if (!topic) {
        errorEl.textContent = "Enter some text first.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Writing...";
      resultsEl.innerHTML = '<p class="hint">Generating...</p>';

      try {
        const res = await fetch("/api/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, mode, tone, count })
        });
        const data = await res.json();

        if (data.error) {
          resultsEl.innerHTML = "";
          errorEl.textContent = data.error;
          return;
        }

        resultsEl.innerHTML = "";
        data.results.forEach((text, i) => {
          const card = document.createElement("div");
          card.className = "result";
          const showNum = data.results.length > 1;
          card.innerHTML =
            (showNum ? `<span class="num">Variation ${i + 1}</span>` : "") +
            `<button class="copy">Copy</button>` +
            escapeHtml(text);
          const copyBtn = card.querySelector(".copy");
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(text);
            copyBtn.textContent = "Copied";
            setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
          };
          resultsEl.appendChild(card);
        });
      } catch (e) {
        resultsEl.innerHTML = "";
        errorEl.textContent = "Something went wrong. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Write it";
      }
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
