<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Content Writer</title>
  <style>
    :root {
      --ink: #1c1a17;
      --paper: #f6f2e9;
      --card: #fffdf8;
      --muted: #6b655c;
      --line: #ddd5c7;
      --accent: #2f6b52;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 16px; margin: 0; }

    .tabs { display: flex; gap: 8px; margin: 24px 0 20px; flex-wrap: wrap; }
    .tab {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 14px; padding: 8px 16px;
      border: 1px solid var(--line); background: transparent;
      border-radius: 999px; cursor: pointer; color: var(--ink);
      transition: all 0.15s;
    }
    .tab:hover { border-color: var(--accent); }
    .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    label {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px; color: var(--muted); display: block;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    textarea {
      width: 100%; min-height: 110px; padding: 14px;
      font-family: Georgia, serif; font-size: 16px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--card); resize: vertical; color: var(--ink);
    }
    textarea:focus { outline: none; border-color: var(--accent); }

    .voice-box {
      margin: 16px 0; padding: 14px 16px;
      background: var(--card); border: 1px dashed var(--line);
      border-radius: 10px;
    }
    .voice-box summary {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 14px; cursor: pointer; color: var(--accent);
      list-style: none;
    }
    .voice-box summary::-webkit-details-marker { display: none; }
    .voice-box input {
      width: 100%; margin-top: 10px; padding: 10px;
      font-family: Georgia, serif; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--paper); color: var(--ink);
    }
    .voice-box input:focus { outline: none; border-color: var(--accent); }
    .voice-hint {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 12px; color: var(--muted); margin: 8px 0 0;
    }

    .controls { display: flex; gap: 16px; margin: 16px 0; flex-wrap: wrap; align-items: flex-end; }
    .control { flex: 1; min-width: 130px; }
    select {
      width: 100%; padding: 10px;
      font-family: -apple-system, system-ui, sans-serif; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--card); color: var(--ink);
    }
    select:focus { outline: none; border-color: var(--accent); }

    .go {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 16px; font-weight: 600; padding: 13px 28px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; cursor: pointer; transition: opacity 0.15s;
    }
    .go:hover { opacity: 0.9; }
    .go:disabled { opacity: 0.5; cursor: default; }

    .error {
      font-family: -apple-system, system-ui, sans-serif;
      color: #a3341f; font-size: 14px; margin-top: 12px;
    }

    .results { margin-top: 32px; }
    .result {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px 22px; margin-bottom: 16px;
      position: relative; white-space: pre-wrap; font-size: 16px;
    }
    .result .num {
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 12px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; display: block; margin-bottom: 8px;
    }
    .btns {
      font-family: -apple-system, system-ui, sans-serif;
      position: absolute; top: 16px; right: 16px; display: flex; gap: 6px;
    }
    .mini {
      font-size: 12px; padding: 5px 12px; border: 1px solid var(--line);
      background: transparent; border-radius: 6px; cursor: pointer; color: var(--muted);
    }
    .mini:hover { border-color: var(--accent); color: var(--accent); }

    .streaming {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 20px 22px;
      white-space: pre-wrap; font-size: 16px; min-height: 40px;
    }
    .caret { display: inline-block; width: 8px; background: var(--accent); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    .hint { font-family: -apple-system, system-ui, sans-serif; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AI Content Writer</h1>
      <p class="sub">Pick a mode, set the tone, and generate copy in one click.</p>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="linkedin">LinkedIn post</button>
      <button class="tab" data-mode="email">Rewrite email</button>
      <button class="tab" data-mode="blog">Blog to social</button>
      <button class="tab" data-mode="product">Product description</button>
      <button class="tab" data-mode="outreach">Cold outreach</button>
      <button class="tab" data-mode="ad">Ad copy</button>
    </div>

    <label id="inputLabel">Your topic</label>
    <textarea id="topic" placeholder="e.g. why small businesses should use AI"></textarea>

    <details class="voice-box">
      <summary>+ Set a brand voice (remembered on this device)</summary>
      <input id="brandVoice" type="text" placeholder="e.g. friendly, witty, plain-spoken, never uses jargon">
      <p class="voice-hint">Saved in your browser and applied to every generation until you change it.</p>
    </details>

    <div class="controls">
      <div class="control">
        <label>Tone</label>
        <select id="tone">
          <option value="default">Default</option>
          <option value="formal">Formal</option>
          <option value="casual">Casual</option>
          <option value="punchy">Punchy</option>
          <option value="friendly">Friendly</option>
        </select>
      </div>
      <div class="control">
        <label>Variations</label>
        <select id="count">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="control" style="flex: 0;">
        <button class="go" id="go" onclick="generate()">Write it</button>
      </div>
    </div>

    <div class="error" id="error"></div>
    <div class="results" id="results">
      <p class="hint">Your results will appear here.</p>
    </div>
  </div>

  <script>
    let mode = "linkedin";
    const labels = {
      linkedin: { label: "Your topic", ph: "e.g. why small businesses should use AI" },
      email: { label: "Paste the email to rewrite", ph: "e.g. Hey, you still haven't sent the file. I need it now." },
      blog: { label: "Paste your blog content or idea", ph: "e.g. a blog post about the benefits of remote work..." },
      product: { label: "Describe the product", ph: "e.g. stainless steel water bottle, keeps drinks cold 24 hours, six colors" },
      outreach: { label: "Who are you contacting, and why?", ph: "e.g. reaching out to a marketing manager to offer freelance web design" },
      ad: { label: "What are you advertising?", ph: "e.g. a fitness app for busy parents, 15-minute home workouts" }
    };

    // Load saved brand voice (browser storage; works on the live site)
    try {
      const saved = localStorage.getItem("brandVoice");
      if (saved) document.getElementById("brandVoice").value = saved;
    } catch (e) {}

    document.getElementById("brandVoice").addEventListener("input", (e) => {
      try { localStorage.setItem("brandVoice", e.target.value); } catch (err) {}
    });

    document.getElementById("tabs").addEventListener("click", (e) => {
      if (!e.target.classList.contains("tab")) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      e.target.classList.add("active");
      mode = e.target.dataset.mode;
      document.getElementById("inputLabel").textContent = labels[mode].label;
      document.getElementById("topic").placeholder = labels[mode].ph;
    });

    async function generate() {
      const topic = document.getElementById("topic").value.trim();
      const tone = document.getElementById("tone").value;
      const count = document.getElementById("count").value;
      const brandVoice = document.getElementById("brandVoice").value;
      const errorEl = document.getElementById("error");
      const resultsEl = document.getElementById("results");
      const btn = document.getElementById("go");

      errorEl.textContent = "";

      if (!topic) {
        errorEl.textContent = "Enter some text first.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Writing...";

      // Live streaming area
      resultsEl.innerHTML = '<div class="streaming" id="stream"><span class="caret">&nbsp;</span></div>';
      const streamEl = document.getElementById("stream");
      let fullText = "";

      try {
        const res = await fetch("/api/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, mode, tone, count, brandVoice })
        });

        // If the server sent a JSON error instead of a stream
        const contentType = res.headers.get("content-type") || "";
        if (contentType.includes("application/json")) {
          const data = await res.json();
          resultsEl.innerHTML = "";
          errorEl.textContent = data.error || "Something went wrong.";
          return;
        }

        // Read the stream chunk by chunk
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          fullText += decoder.decode(value, { stream: true });
          streamEl.innerHTML = escapeHtml(fullText) + '<span class="caret">&nbsp;</span>';
        }

        // Streaming done — split into variation cards with buttons
        renderCards(fullText, resultsEl);
      } catch (e) {
        resultsEl.innerHTML = "";
        errorEl.textContent = "Something went wrong. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Write it";
      }
    }

    function renderCards(text, container) {
      const parts = text.split(/\n?---\n?/).map(s => s.trim()).filter(Boolean);
      container.innerHTML = "";
      parts.forEach((part, i) => {
        const card = document.createElement("div");
        card.className = "result";
        const showNum = parts.length > 1;
        card.innerHTML =
          (showNum ? `<span class="num">Variation ${i + 1}</span>` : "") +
          `<div class="btns"><button class="mini copy">Copy</button><button class="mini dl">Download</button></div>` +
          escapeHtml(part);

        const copyBtn = card.querySelector(".copy");
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(part);
          copyBtn.textContent = "Copied";
          setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
        };

        const dlBtn = card.querySelector(".dl");
        dlBtn.onclick = () => downloadText(part, `content-${i + 1}.txt`);

        container.appendChild(card);
      });
    }

    function downloadText(text, filename) {
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
  </script>

</body>
</html>
